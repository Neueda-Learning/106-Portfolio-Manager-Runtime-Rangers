version: "3.9"

services:

  mysql:
    image: mysql:8.0
    container_name: portfolio-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-n3u3da!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-portfolio_db}
      MYSQL_USER: ${MYSQL_USER:-portfolio_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-portfolio_password}

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - portfolio-network

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD:-n3u3da!}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend

    container_name: portfolio-backend
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: dev

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-portfolio_db}

      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-portfolio_user}

      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-portfolio_password}

    ports:
      - "8082:8082"

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - portfolio-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8082/api/market || exit 1"
        ]

      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s


  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend

    container_name: portfolio-frontend
    restart: unless-stopped

    ports:
      - "8085:80"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - portfolio-network


volumes:
  mysql_data:
    driver: local


networks:
  portfolio-network:
    driver: bridge